<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>결제수단 조사</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #faf9f5; --surface: #fff; --ink: #1d1d1b; --ink-2: #5f5e58;
    --line: #e6e4dc; --accent: #e8590c; --accent-soft: #fff1e6;
    --yes: #2f9e44; --yes-soft: #e6f4ea; --no: #e03131; --no-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191917; --surface: #222220; --ink: #ecebe4; --ink-2: #a5a49c;
      --line: #35342f; --accent: #ff7a33; --accent-soft: #3a2417;
      --yes: #51cf66; --yes-soft: #1c3524; --no: #ff6b6b; --no-soft: #3d1f1f;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif;
    padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 14px 8px;
  }
  h1 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h1 .cnt { font-size: 12px; font-weight: 400; color: var(--ink-2); margin-left: auto; }
  .toolbar { display: flex; gap: 6px; margin-top: 8px; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 0; padding: 8px 12px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink);
  }
  .tbtn {
    padding: 8px 10px; font-size: 13px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink-2);
  }
  .tbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  #list { padding: 6px 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .card.done { border-left: 4px solid var(--yes); }
  .rname { font-weight: 700; font-size: 15px; }
  .rmeta { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .rmeta .dist { color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    padding: 7px 13px; border-radius: 999px; font-size: 14px; font-weight: 600;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2);
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .chip.yes { background: var(--yes-soft); border-color: var(--yes); color: var(--yes); }
  .chip.no  { background: var(--no-soft);  border-color: var(--no);  color: var(--no); text-decoration: line-through; }
  .memo {
    width: 100%; margin-top: 8px; padding: 7px 10px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink);
  }
  .empty { text-align: center; color: var(--ink-2); padding: 40px 0; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .fbtn {
    flex: 1; padding: 12px 0; font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; background: var(--surface);
    color: var(--ink); border: 1px solid var(--line);
  }
  .fbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  dialog {
    border: none; border-radius: 16px; padding: 18px; width: min(92vw, 380px);
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { font-size: 16px; margin-bottom: 12px; }
  dialog label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
  dialog input, dialog select {
    width: 100%; padding: 9px 11px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink);
  }
  .dlg-actions { display: flex; gap: 8px; margin-top: 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🍴 결제수단 조사 <span class="cnt" id="cnt"></span></h1>
  <div class="toolbar">
    <input type="search" id="q" placeholder="식당 검색" />
    <button class="tbtn" id="btn-todo">미조사만</button>
    <button class="tbtn" id="btn-near">📍 가까운순</button>
    <button class="tbtn" id="btn-sync">☁</button>
  </div>
</header>

<div id="list"></div>

<footer>
  <button class="fbtn" id="btn-add">＋ 새 식당</button>
  <button class="fbtn" id="btn-pays">페이 종류</button>
  <button class="fbtn primary" id="btn-export">내보내기</button>
</footer>

<dialog id="dlg-add">
  <h2>새 식당 추가</h2>
  <label>이름 *</label>
  <input id="add-name" placeholder="식당 이름" />
  <label>카테고리</label>
  <select id="add-cat">
    <option>한식</option><option>중식</option><option>일식</option><option>양식</option>
    <option>분식</option><option>치킨/고기</option><option>카페/디저트</option>
    <option selected>기타</option>
  </select>
  <label>메모</label>
  <input id="add-memo" placeholder="위치 힌트 등" />
  <div class="dlg-actions">
    <button class="fbtn" id="add-cancel">취소</button>
    <button class="fbtn primary" id="add-ok">추가 (현재 GPS 위치로)</button>
  </div>
</dialog>

<dialog id="dlg-pays">
  <h2>조사할 페이 종류</h2>
  <div id="pay-list" class="chips" style="margin-bottom:4px"></div>
  <label>추가할 페이 이름</label>
  <input id="pay-new" placeholder="예: 식권대장" />
  <div class="dlg-actions">
    <button class="fbtn" id="pays-close">닫기</button>
    <button class="fbtn primary" id="pays-add">추가</button>
  </div>
</dialog>

<dialog id="dlg-sync">
  <h2>☁ GitHub 자동 백업</h2>
  <p style="font-size:13px;color:var(--ink-2);margin-bottom:4px">
    입력할 때마다 lunch-pay-survey 저장소에 자동 업로드됩니다.
    토큰은 이 폰에만 저장돼요.
  </p>
  <label>GitHub 토큰 (fine-grained, Contents 쓰기)</label>
  <input id="sync-token" type="password" placeholder="github_pat_..." autocomplete="off" />
  <div id="sync-status" style="font-size:13px;color:var(--ink-2);margin-top:10px">—</div>
  <div class="dlg-actions">
    <button class="fbtn" id="sync-close">닫기</button>
    <button class="fbtn" id="sync-now">지금 백업</button>
    <button class="fbtn primary" id="sync-save">저장</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);

// ── 저장소 ──────────────────────────────────────────────
// 본체 앱과 별도 키. entries[id] = { pays: {이름: true|false}, memo, at }
const KEY = "lunch_pay_survey_v1";
const DEFAULT_PAYS = ["제로페이", "페이코", "네이버페이"];
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || "{}");
    return { entries: d.entries || {}, added: d.added || [],
             payTypes: d.payTypes || DEFAULT_PAYS.slice() };
  } catch { return { entries: {}, added: [], payTypes: DEFAULT_PAYS.slice() }; }
}
function save() {
  db.updatedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(db));
  scheduleSync();
}

// ── GitHub 자동 백업 ─────────────────────────────────────
// 입력 후 3초 지나면 저장소의 data/survey.json 에 커밋 (fine-grained 토큰 필요)
const TOKEN_KEY = "lunch_pay_survey_gh_token";
const GH_FILE = "https://api.github.com/repos/mkseo90/lunch-pay-survey/contents/data/survey.json";
let ghToken = localStorage.getItem(TOKEN_KEY) || "";
let remoteSha = null;      // null = 아직 모름, undefined = 파일 없음
let syncTimer = null, syncing = false, syncMsg = "";

function ghHeaders() {
  return { "Authorization": "Bearer " + ghToken, "Accept": "application/vnd.github+json" };
}
function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(s) {
  const bin = atob(s.replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function setCloud(msg, icon) {
  syncMsg = msg;
  $("btn-sync").textContent = icon || "☁";
  const st = $("sync-status");
  if (st) st.textContent = msg;
}
function scheduleSync() {
  if (!ghToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 3000);
}
async function syncNow() {
  if (!ghToken || syncing) { if (syncing) scheduleSync(); return; }
  syncing = true;
  setCloud("업로드 중…", "⏳");
  try {
    if (remoteSha === null) {
      const r = await fetch(GH_FILE, { headers: ghHeaders() });
      if (r.status === 200) remoteSha = (await r.json()).sha;
      else if (r.status === 404) remoteSha = undefined;
      else throw new Error("HTTP " + r.status);
    }
    const body = JSON.stringify({
      exportedAt: new Date().toISOString(),
      payTypes: db.payTypes, entries: db.entries, added: db.added,
    }, null, 2);
    const payload = { message: "survey sync", content: b64(body) };
    if (remoteSha) payload.sha = remoteSha;
    const r2 = await fetch(GH_FILE, {
      method: "PUT",
      headers: { ...ghHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (r2.status === 409 || r2.status === 422) { remoteSha = null; throw new Error("충돌 — 다시 시도하세요"); }
    if (!r2.ok) throw new Error("HTTP " + r2.status);
    remoteSha = (await r2.json()).content.sha;
    setCloud("백업됨 " + new Date().toLocaleTimeString("ko-KR", { hour12: false }), "☁✓");
  } catch (e) {
    setCloud("백업 실패: " + e.message + (e.message.includes("401") ? " (토큰 확인)" : ""), "☁!");
  }
  syncing = false;
}
// 로컬이 비어 있고 서버에 백업이 있으면 복원 제안
async function maybeRestore() {
  if (!ghToken) return;
  const empty = !Object.keys(db.entries).length && !db.added.length;
  if (!empty) return;
  try {
    const r = await fetch(GH_FILE, { headers: ghHeaders() });
    if (r.status !== 200) return;
    const j = await r.json();
    remoteSha = j.sha;
    const remote = JSON.parse(b64dec(j.content));
    const n = Object.keys(remote.entries || {}).length;
    if (!n && !(remote.added || []).length) return;
    if (confirm(`서버 백업(조사 ${n}곳)이 있습니다. 불러올까요?`)) {
      db.entries = remote.entries || {};
      db.added = remote.added || [];
      db.payTypes = remote.payTypes || db.payTypes;
      localStorage.setItem(KEY, JSON.stringify(db));   // save()의 재업로드 없이 저장만
      render();
      toast("복원 완료");
    }
  } catch {}
}

$("btn-sync").onclick = () => {
  $("sync-token").value = ghToken;
  $("sync-status").textContent = syncMsg || (ghToken ? "토큰 저장됨" : "토큰이 없으면 백업이 꺼져 있습니다");
  $("dlg-sync").showModal();
};
$("sync-close").onclick = () => $("dlg-sync").close();
$("sync-save").onclick = () => {
  ghToken = $("sync-token").value.trim();
  if (ghToken) localStorage.setItem(TOKEN_KEY, ghToken);
  else localStorage.removeItem(TOKEN_KEY);
  remoteSha = null;
  toast(ghToken ? "토큰 저장됨 — 자동 백업 켜짐" : "토큰 삭제됨 — 백업 꺼짐");
  if (ghToken) syncNow();
};
$("sync-now").onclick = () => { remoteSha = null; syncNow(); };

// ── 데이터 ──────────────────────────────────────────────
let seed = [];
let pos = null;            // {lat, lng} 현재 위치
let query = "", todoOnly = false, nearSort = false;

async function boot() {
  try {
    const res = await fetch("seed-restaurants.json?v=" + Date.now());
    if (res.ok) seed = await res.json();
  } catch {}
  render();
  maybeRestore();
}

function allRestaurants() {
  return seed.concat(db.added);
}
function entryOf(id) {
  return db.entries[id] || null;
}
function isDone(id) {
  const e = entryOf(id);
  return !!e && db.payTypes.some((p) => e.pays[p] !== undefined);
}
function dist(r) {
  if (!pos || r.lat == null) return Infinity;
  const dx = (r.lng - pos.lng) * 88000, dy = (r.lat - pos.lat) * 111000;
  return Math.hypot(dx, dy);
}

// ── 렌더 ────────────────────────────────────────────────
function render() {
  let rows = allRestaurants();
  if (query) rows = rows.filter((r) => r.name.toLowerCase().includes(query));
  if (todoOnly) rows = rows.filter((r) => !isDone(r.id));
  rows = rows.slice();
  if (nearSort && pos) rows.sort((a, b) => dist(a) - dist(b));
  else rows.sort((a, b) => a.name.localeCompare(b.name, "ko"));

  const total = allRestaurants().length;
  const done = allRestaurants().filter((r) => isDone(r.id)).length;
  $("cnt").textContent = `조사 ${done} / ${total}`;

  const list = $("list");
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = `<div class="empty">표시할 식당이 없습니다</div>`;
    return;
  }
  for (const r of rows) {
    const e = entryOf(r.id);
    const card = document.createElement("div");
    card.className = "card" + (isDone(r.id) ? " done" : "");
    const d = dist(r);
    const distTxt = (nearSort && pos && isFinite(d))
      ? `<span class="dist">${d < 1000 ? Math.round(d) + "m" : (d / 1000).toFixed(1) + "km"}</span> · ` : "";
    card.innerHTML =
      `<div class="rname">${esc(r.name)}</div>
       <div class="rmeta">${distTxt}${esc(r.category || "기타")}${r.address ? " · " + esc(r.address.replace("서울 강서구 마곡동 ", "")) : ""}</div>
       <div class="chips"></div>
       <input class="memo" placeholder="메모 (예: 점심 할인, 폐업)" value="${esc(e?.memo || "")}" />`;
    const chips = card.querySelector(".chips");
    for (const p of db.payTypes) {
      const chip = document.createElement("span");
      const st = e ? e.pays[p] : undefined;          // true | false | undefined
      chip.className = "chip" + (st === true ? " yes" : st === false ? " no" : "");
      chip.textContent = (st === true ? "✓ " : st === false ? "✕ " : "") + p;
      chip.onclick = () => {
        const en = db.entries[r.id] || (db.entries[r.id] = { pays: {}, memo: "" });
        // 탭 순환: 미확인 → 됨 → 안됨 → 미확인
        en.pays[p] = en.pays[p] === undefined ? true : en.pays[p] === true ? false : undefined;
        if (en.pays[p] === undefined) delete en.pays[p];
        en.at = new Date().toISOString();
        save(); render();
      };
      chips.appendChild(chip);
    }
    card.querySelector(".memo").onchange = (ev) => {
      const en = db.entries[r.id] || (db.entries[r.id] = { pays: {}, memo: "" });
      en.memo = ev.target.value.trim();
      en.at = new Date().toISOString();
      save();
    };
    list.appendChild(card);
  }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ── 툴바 ────────────────────────────────────────────────
$("q").oninput = (e) => { query = e.target.value.trim().toLowerCase(); render(); };
$("btn-todo").onclick = () => {
  todoOnly = !todoOnly;
  $("btn-todo").classList.toggle("on", todoOnly);
  render();
};
$("btn-near").onclick = () => {
  if (nearSort) { nearSort = false; $("btn-near").classList.remove("on"); render(); return; }
  if (!navigator.geolocation) return toast("이 브라우저는 위치를 지원하지 않아요");
  toast("위치 확인 중…");
  navigator.geolocation.getCurrentPosition(
    (p) => { pos = { lat: p.coords.latitude, lng: p.coords.longitude };
             nearSort = true; $("btn-near").classList.add("on"); render(); },
    () => toast("위치를 가져올 수 없어요 (HTTPS 필요할 수 있음)"),
    { enableHighAccuracy: true, timeout: 8000 });
};

// ── 새 식당 ─────────────────────────────────────────────
$("btn-add").onclick = () => { $("add-name").value = ""; $("add-memo").value = ""; $("dlg-add").showModal(); };
$("add-cancel").onclick = () => $("dlg-add").close();
$("add-ok").onclick = () => {
  const name = $("add-name").value.trim();
  if (!name) return toast("이름을 입력하세요");
  const finish = (lat, lng) => {
    db.added.push({
      id: "r_s" + Date.now().toString(36),
      name, category: $("add-cat").value,
      lat, lng, address: "", placeUrl: "",
      memo: $("add-memo").value.trim(), addedBySurvey: true,
    });
    save(); $("dlg-add").close(); render();
    toast(lat != null ? "현재 위치로 추가됨" : "추가됨 (위치 없음)");
  };
  if (!navigator.geolocation) return finish(null, null);
  navigator.geolocation.getCurrentPosition(
    (p) => finish(p.coords.latitude, p.coords.longitude),
    () => finish(null, null), { enableHighAccuracy: true, timeout: 6000 });
};

// ── 페이 종류 관리 ───────────────────────────────────────
$("btn-pays").onclick = () => { renderPayList(); $("dlg-pays").showModal(); };
$("pays-close").onclick = () => $("dlg-pays").close();
$("pays-add").onclick = () => {
  const name = $("pay-new").value.trim();
  if (!name) return;
  if (!db.payTypes.includes(name)) { db.payTypes.push(name); save(); }
  $("pay-new").value = ""; renderPayList(); render();
};
function renderPayList() {
  const el = $("pay-list");
  el.innerHTML = "";
  for (const p of db.payTypes) {
    const chip = document.createElement("span");
    chip.className = "chip yes";
    chip.textContent = p + "  ⓧ";
    chip.onclick = () => {
      if (!confirm(`'${p}' 항목을 빼면 목록에서 안 보입니다 (기록은 유지). 뺄까요?`)) return;
      db.payTypes = db.payTypes.filter((x) => x !== p);
      save(); renderPayList(); render();
    };
    el.appendChild(chip);
  }
}

// ── 내보내기 ────────────────────────────────────────────
$("btn-export").onclick = async () => {
  const out = JSON.stringify({
    exportedAt: new Date().toISOString(),
    payTypes: db.payTypes, entries: db.entries, added: db.added,
  }, null, 2);
  try {
    await navigator.clipboard.writeText(out);
    toast("클립보드에 복사됨 — 카톡/메모로 PC에 보내세요");
  } catch {
    if (navigator.share) { navigator.share({ text: out }); }
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([out], { type: "application/json" }));
      a.download = "pay-survey.json"; a.click();
    }
  }
};

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

boot();
})();
</script>
</body>
</html>
